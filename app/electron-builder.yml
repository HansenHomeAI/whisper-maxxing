appId: com.hansenhomeai.whisper-maxxing
productName: Whisper Maxxing
asar: true
directories:
  output: release
files:
  - dist-electron/**
  - dist-renderer/**
  - bin/wdctl.mjs
  - package.json
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Whisper Maxxing uses the microphone only while capturing local dictation.
  target:
    - dmg
    - zip
dmg:
  sign: false
  writeUpdateInfo: false
win:
  icon: build/icon.ico
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Whisper Maxxing
