name: Electron CI

on:
  push:
  pull_request:

jobs:
  electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select Swift 6 toolchain
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - run: npm ci
      - name: Build native macOS capture helper
        if: runner.os == 'macOS'
        run: npm run build:native-capture
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:pipeline
      - run: npm run test:capture
      - run: npm run test:ux
      - run: npm run test:settings
      - run: npm run e2e:settings
      - run: npm run e2e:overlay
      - run: npm run e2e:capture-smoke
      - run: npm run e2e:protocol
      - run: npm run soak
        env:
          SOAK_CYCLES: 50
      - name: Test Windows whisper bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0
          Invoke-Pester -Path scripts/setup-whisper-windows.Tests.ps1 -Output Detailed

  swift:
    name: Swift (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - run: swift build
      - run: swift run transcript-quality-tests

  dist:
    name: Dist (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Select Swift 6 toolchain
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - run: npm ci
      - run: npm run dist
      - run: node tests/dist-smoke/check-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-maxxing-${{ matrix.os }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
          if-no-files-found: error
